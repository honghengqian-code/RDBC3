upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Report attachments: up to 5 files x 5MB each, plus JSON overhead.
    client_max_body_size 30M;

    # Django REST API.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django's own collected static assets (admin site CSS/JS, DRF browsable
    # API). Served directly by nginx from the shared static_volume — Django
    # only serves these itself when DEBUG=True.
    location /static/ {
        alias /app/staticfiles/;
    }

    # Uploaded attachments. Served directly by nginx from the shared
    # media_volume for the same reason.
    location /media/ {
        alias /app/media/;
    }

    # Everything else — including /admin/* — goes to the Next.js app. Note:
    # this means Django's built-in admin site (also mounted at /admin/,
    # config/urls.py) is not reachable through nginx, since that path is
    # claimed by the Next.js admin dashboard. It's still reachable directly
    # on the backend container's internal port if ever needed.
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
