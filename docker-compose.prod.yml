# Production overlay: gunicorn instead of runserver, a built Next.js app
# instead of the dev server, and nginx as the single public entry point.
# Run alongside the base file only (skip docker-compose.override.yml, which
# is dev-only): docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  backend:
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Same origin as nginx (empty base = relative /api/... requests),
        # so the browser never needs a separate backend origin/CORS hop.
        NEXT_PUBLIC_API_BASE_URL: ""
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"

volumes:
  static_volume:
  media_volume:
