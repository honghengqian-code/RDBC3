# Local dev overrides: hot reload via bind mounts, dev servers instead of
# production builds. Compose merges this over docker-compose.yml automatically.
services:
  backend:
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
